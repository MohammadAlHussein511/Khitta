<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="خِطّة — منظّم مهام شخصي يعمل بلا إنترنت وفق مصفوفة آيزنهاور، مع أسبوع السبت→الجمعة وتذكيرات على مستوى النظام.">
<title>خِطّة</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="app" id="app">

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="ic ic-lg"><use href="#i-target"></use></svg>
        </span>
        <span class="brand-text">
          <span class="brand-title" id="brandTitle">خِطّة</span>
          <span class="brand-sub" id="brandSub"></span>
        </span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnLang" type="button" aria-label="Language"></button>
        <button class="icon-btn" id="btnTheme" type="button" aria-label="Theme"></button>
      </div>
    </div>
    <div class="topbar-extra" id="topbarExtra"></div>
  </header>

  <main class="view" id="view">
    <section class="screen" id="screen-matrix" data-screen="matrix" role="tabpanel"></section>
    <section class="screen" id="screen-week" data-screen="week" role="tabpanel" hidden></section>
    <section class="screen" id="screen-stats" data-screen="stats" role="tabpanel" hidden></section>
    <section class="screen" id="screen-settings" data-screen="settings" role="tabpanel" hidden></section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Add task">
    <svg class="ic ic-lg"><use href="#i-plus"></use></svg>
  </button>

  <nav class="tabbar" id="tabbar" role="tablist"></nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet-root" id="sheetRoot"></div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>
